    signals_all: [support_break]      # decision B5: 2-bar break required; engulfing alone does not qualify
    not_extended: auto            # bearish → not extended down (RSI > 30)
    alignment: soft
  scoring:
    weights: { signal: 20, level_quality: 10, confluence: 5, trend_fit: 20, flow: 10, room: 15, rsi_headroom: 10, entry_quality: 5, age: 5 }  # directional debit: trend strength, room to run, RSI headroom
  construction:
    - "Buy 0.4–0.6Δ put 10–45 DTE"
    - "Sell 1–4 strikes lower put, same expiration"
  orats_checklist:
    - "IVR < 65 (don't buy expensive premium)"
  other_manual_checks:
    - "Asymmetric downside driven by some macro narrative that market is not properly pricing"
    - "No earnings"
    - "Verify macro events"
    - "Price isn't 'extended' (confirm on chart)"
  plan:
    max_bp_pct: 10
    profit_target: "10 – 200% (debit paid)"
    stop_loss: "10 – 50%"
    management:
      - "Exit if 2-bar close above pre-defined resistance level: {nearest_resistance}"
      - "Exit no later than Wed before expiration"

- id: bull_put_spread
  name: Bull Put Spread
  enabled: true
  status: complete
  bias: non_bearish
  technical:
    trend: [uptrend, range]
    signals_any: [support_hold]
    not_extended: none
    alignment: soft
  scoring:
    weights: { signal: 20, level_quality: 25, confluence: 15, trend_fit: 10, flow: 10, room: 0, rsi_headroom: 0, entry_quality: 15, age: 5 }  # premium sold at a level: level quality, confluence, entry at the level
  construction:
    - "Sell a ~0.3Δ put 5–20 DTE"
    - "Buy a put one strike lower, same expiration"
    - "Aim to collect ~1/3 strike width in premium"
  orats_checklist:
    - "IVR > 50 (IV elevated)"
    - "ivHvXernRatio > 1 (IV elevated relative to HV)"
    - "orFcst20d / orIvXern20d < 1 (forecasting muted HV vs. IV)"
    - "stkPxChng1m > 0"
    - "stkPxChng1wk > 0"
    - "confidence > 80"
    - "50 < stockPrice < 500"
    - "Confirm D/F/S edge (Distribution / Forecast / Smooth-market vols)"
  other_manual_checks:
    - "No earnings within DTE horizon"
    - "Check for any macro events"
  plan:
    max_bp_pct: 5
    profit_target: "30 – 75%"
    stop_loss: "35 – 100% (credit received)"
    management:
      - "Exit if 2-bar close below short strike"
      - "Exit no later than Wed before expiration"
      - "Utilize time-based exits (win/lose/draw)"

