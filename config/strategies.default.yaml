# strategies.yaml — the strategy playbook. Edit freely; run `scanner validate` after changes.
# Evaluated by the scanner:  bias, technical, scoring (weights replace settings.yaml → scoring.weights)
# Display-only (shown on cards): construction, orats_checklist, other_manual_checks, plan

- id: bull_call_spread
  name: Bull Call Spread
  enabled: true
  status: complete
  bias: bullish
  technical:
    trend: [any]
    signals_all: [resistance_break]   # decision B5: 2-bar break required; engulfing alone does not qualify
    not_extended: auto            # bullish → not extended up (RSI < 70)
    alignment: soft
  scoring:
    weights: { signal: 20, level_quality: 10, confluence: 5, trend_fit: 20, flow: 10, room: 15, rsi_headroom: 10, entry_quality: 5, age: 5 }  # directional debit: trend strength, room to run, RSI headroom
  construction:
    - "Buy 0.4–0.6Δ call 10–45 DTE"
    - "Sell 1–4 strikes higher call, same expiration"
  orats_checklist:
    - "IVR < 65 (don't buy expensive premium)"
  other_manual_checks:
    - "Asymmetric upside driven by some macro narrative that market is not properly pricing"
    - "No earnings"
    - "Verify macro events"
    - "Price isn't 'extended' (confirm on chart)"
  plan:
    max_bp_pct: 10
    profit_target: "10 – 200% (debit paid)"
    stop_loss: "10 – 50%"
    management:
      - "Exit if 2-bar close below pre-defined support level: {nearest_support}"
      - "Exit no later than Wed before expiration"

- id: bear_put_spread
  name: Bear Put Spread
