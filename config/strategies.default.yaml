# strategies.yaml — the strategy playbook. Edit freely, or use the app's Criteria tab (it validates before saving).
# Evaluated by the scanner:  bias, technical, scoring (weights replace settings.yaml → scoring.weights)
# Any other key you add (e.g. notes:) is shown on cards as written and never evaluated.

- id: bull_call_spread
  name: Bull Call Spread
  enabled: true
  bias: bullish
  technical:
    trend: [any]
    signals_all: [resistance_break]   # decision B5: 2-bar break required; engulfing alone does not qualify
    not_extended: auto            # bullish → not extended up (RSI < 70)
    alignment: soft
  scoring:
    weights: { signal: 20, level_quality: 10, confluence: 5, trend_fit: 20, flow: 10, room: 15, rsi_headroom: 10, entry_quality: 5, age: 5 }  # directional debit: trend strength, room to run, RSI headroom

- id: bear_put_spread
  name: Bear Put Spread
  enabled: true
  bias: bearish
  technical:
    trend: [any]
    signals_all: [support_break]      # decision B5: 2-bar break required; engulfing alone does not qualify
    not_extended: auto            # bearish → not extended down (RSI > 30)
    alignment: soft
  scoring:
    weights: { signal: 20, level_quality: 10, confluence: 5, trend_fit: 20, flow: 10, room: 15, rsi_headroom: 10, entry_quality: 5, age: 5 }  # directional debit: trend strength, room to run, RSI headroom

- id: bull_put_spread
  name: Bull Put Spread
  enabled: true
  bias: non_bearish
  technical:
    trend: [uptrend, range]
    signals_any: [support_hold]
    not_extended: none
    alignment: soft
  scoring:
    weights: { signal: 20, level_quality: 25, confluence: 15, trend_fit: 10, flow: 10, room: 0, rsi_headroom: 0, entry_quality: 15, age: 5 }  # premium sold at a level: level quality, confluence, entry at the level

- id: bear_call_spread
  name: Bear Call Spread
  enabled: true
  bias: non_bullish
  technical:
    trend: [downtrend, range]
    signals_any: [resistance_hold]
    not_extended: none
    alignment: soft
  scoring:
    weights: { signal: 20, level_quality: 25, confluence: 15, trend_fit: 10, flow: 10, room: 0, rsi_headroom: 0, entry_quality: 15, age: 5 }  # premium sold at a level: level quality, confluence, entry at the level

- id: neutral_calendar
  name: Neutral Calendar
  enabled: true
  bias: neutral
  technical:
    trend: [range]
    signals_all: [range_bound, range_mid]
    signals_any: []
    not_extended: none
    alignment: ignore
  scoring:
    weights: { signal: 15, level_quality: 10, confluence: 5, trend_fit: 25, flow: 0, room: 25, rsi_headroom: 10, entry_quality: 5, age: 5 }  # range-bound: range quality, price centred, RSI near 50; flow ignored

- id: pmcc
  name: PMCC (Poor Man's Covered Call)
  enabled: true
  bias: non_bearish
  technical:
    trend: [uptrend]
    signals_any: [support_hold, bullish_engulfing]
    not_extended: up
    alignment: soft

- id: pmcp
  name: PMCP (Poor Man's Covered Put)
  enabled: true
  bias: non_bullish
  technical:
    trend: [downtrend]
    signals_any: [resistance_hold, bearish_engulfing]
    not_extended: down
    alignment: soft

- id: wheel
  name: Wheel (Cycle-Recycle)
  enabled: true
  bias: non_bearish
  technical:
    trend: [uptrend, range]
    signals_any: [support_hold]
    not_extended: none
    alignment: soft                # owner favors rising relative strength vs sector ETF
  scoring:
    weights: { signal: 20, level_quality: 25, confluence: 15, trend_fit: 10, flow: 10, room: 0, rsi_headroom: 0, entry_quality: 15, age: 5 }  # premium sold at a level: level quality, confluence, entry at the level

- id: ted_calendar
  name: TED Calendar
  enabled: false                   # no technical rules; not evaluated
  bias: neutral
  technical: {}                    # none

- id: flyagonal
  name: Flyagonal
  enabled: false
  bias: neutral
  technical: {}

- id: long_stock
  name: Long Stock
  enabled: true
  bias: bullish
  technical:
    trend: [uptrend]
    signals_any: [support_hold]
    not_extended: up
    alignment: soft                # owner favors rising relative strength vs sector ETF
  scoring:
    weights: { signal: 20, level_quality: 10, confluence: 5, trend_fit: 20, flow: 10, room: 15, rsi_headroom: 10, entry_quality: 5, age: 5 }  # directional debit: trend strength, room to run, RSI headroom
