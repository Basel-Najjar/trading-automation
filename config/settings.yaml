# settings.yaml — global technical parameters. Every key is optional; omitted keys use the defaults shown.
# Keys marked [added] are not in requirements §6.9; they make implicit spec values configurable.
# The app validates on load and before every save; an invalid file shows its errors on the page.

data:
  history_years: 3
  price_adjustment: split_only # split_only | total_return
  benchmark: SPY
  min_bars: 250 # [added] skip symbols with fewer completed bars (DS-9)
  allow_partial_history: false # [added] analyse short histories; SMA200 logic becomes n/a
  gap_skip_atr: 3.0 # [added] skip a symbol whose open gapped more than this many ATRs …
  gap_lookback_bars: 15 # [added] … within this many recent bars (~3 weeks); older gaps are fine
  stale_bar_sessions: 1 # [added] warn if last bar is more than this many sessions old
  cache_dir: cache # [added]
  cache_revision_rel_tol: 0.0001 # [added] relative tolerance for split/revision detection (DS-7)
  close_buffer_minutes: 30 # [added] bars are provisional until close + this buffer (US/Eastern)
  batch_size: 40 # [added] tickers per yfinance request
  max_retries: 3 # [added]

indicators:
  atr_period: 14
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  relvol_period: 20 # [added] informational relative volume

pivots:
  pivot_window: 5

levels:
  zone_atr_mult: 0.25 # zone half-width in ATRs
  cluster_atr_mult: 0.5
  min_touches_horizontal: 2
  min_touches_diagonal: 2
  trendline_lookback_bars: 250
  trendline_scale: linear # linear | log
  nearest_levels_per_side: 3
  horizontal_lookback_bars: null # [added] null = whole analysis window
  recency_half_life_bars: 60 # [added] quality = touches × 0.5^(bars since last touch / half-life)
  max_trendlines_per_side: 2 # [added] spec default "top 2"
  sma_base_quality: { sma50: 2.0, sma200: 3.0 } # [added] SMAs have no touches; fixed quality
  manual_quality: 3.0 # [added]

signals:
  full_body_ratio: 0.70
  break_confirm: prior_extreme # 2-bar break: prior_extreme (both bars strong, 2nd closes beyond the 1st's high/low) | engulf
  break_engulfing_require_opposite_color: false # breaks in engulf mode (spec OQ-1 default)
  pattern_engulfing_require_opposite_color: true # [added, decision B3] standalone engulfing patterns
  engulfing_tolerance_atr: 0.0 # [added] body-containment slack, in ATRs
  hold_test_lookback: 3
  hold_require_prior_side: true # [added, decision B4] test bar must come from the support/resistance side
  break_prior_side_bars: 3 # [decision B5] closes before a 2-bar break that must stay on the level's side
  approach_atr: 1.0
  approach_lookback_bars: 3 # [added] "moving toward": closer to the level than this many bars ago
  chase_atr: 1.5
  held_swing_bars: 5 # [added] *_held: the test bar's low (high) is the lowest (highest) of this many bars before it
  # how far back signals count is per scan: `lookback_bars` in scans.yaml

range:
  mid_band: [0.35, 0.65]
  channel_min_touches: 1 # [added] `channel:` criterion: bars touching each side's zone within the window

flow: # [added, decision B2] which trend states agree/oppose each scan direction (the `flow:` criterion)
  agree:
    bullish: [uptrend]
    non_bearish: [uptrend, range]
    neutral: [range]
    non_bullish: [downtrend, range]
    bearish: [downtrend]
  oppose:
    bullish: [downtrend]
    non_bearish: [downtrend]
    neutral: [uptrend, downtrend]
    non_bullish: [uptrend]
    bearish: [uptrend]

display:
  max_watch_items: 30
  max_watch_items_per_symbol: 3 # [added] spec WL-3 default
  chart_bars: 150 # bars the price chart covers (the app opens on at most 60)
